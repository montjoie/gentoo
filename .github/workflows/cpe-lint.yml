# Fork-only CI for CPE metadata work. Never include .github/ in upstream PRs.
#
# Workflow:
#   fork master (or 'ci' branch) = upstream master + this CI commit
#   topic branch cpe/<something> = upstream master + CPE commits only
#   open a (draft) PR *inside the fork*: cpe/<something> -> master
#   pull_request runs this workflow from the base branch, and the jobs below
#   check out the topic head itself, so the CI files never enter the topic.
name: cpe-lint

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: topic branch / sha to check
        required: true

concurrency:
  group: cpe-lint-${{ github.event.pull_request.number || inputs.ref }}
  cancel-in-progress: true

env:
  UPSTREAM: https://github.com/gentoo/gentoo.git
  TOPIC: ${{ github.event.pull_request.head.sha || inputs.ref }}
  CI_REF: ${{ github.event.pull_request.base.sha || github.sha }}

jobs:
  guard:
    name: topic branch is upstream-clean
    runs-on: ubuntu-latest
    steps:
      - &checkout-topic
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPIC }}
          fetch-depth: 50
      - &find-base
        name: find upstream merge-base
        run: |
          git fetch --no-tags --depth=50 "$UPSTREAM" master:refs/remotes/upstream/master
          base=
          for i in 1 2 3 4 5 6; do
            base=$(git merge-base upstream/master HEAD) && break
            git fetch --no-tags --deepen=200 "$UPSTREAM" master:refs/remotes/upstream/master
            git fetch --no-tags --deepen=200 origin "$TOPIC" || true
          done
          test -n "$base" || { echo "::error::no merge-base with upstream master"; exit 1; }
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "merge-base: $base"
      - name: no .github changes, Signed-off-by on every commit
        run: |
          rc=0
          if git diff --name-only "$BASE" HEAD -- .github | grep .; then
            echo "::error::topic branch modifies .github/, drop those commits before the upstream PR"
            rc=1
          fi
          for c in $(git rev-list "$BASE"..HEAD); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' \
              || { echo "::error::commit $(git log -1 --format='%h %s' "$c") lacks Signed-off-by"; rc=1; }
          done
          exit $rc

  cpe-lint:
    name: CPE syntax / duplicates
    runs-on: ubuntu-latest
    steps:
      - *checkout-topic
      - &checkout-ci
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_REF }}
          path: _ci
          sparse-checkout: .github
      - *find-base
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: lint changed CPEs
        run: python3 _ci/.github/scripts/cpe-lint.py --base "$BASE" --github

  xml-schema:
    name: metadata.xsd validation
    runs-on: ubuntu-latest
    steps:
      - *checkout-topic
      - *find-base
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - run: curl -sfL -o "$RUNNER_TEMP/metadata.xsd" https://www.gentoo.org/xml-schema/metadata.xsd
      - name: validate
        run: |
          rc=0
          for f in $(git diff --name-only --diff-filter=AMR "$BASE"...HEAD -- '*/*/metadata.xml'); do
            xmllint --noout --nonet --schema "$RUNNER_TEMP/metadata.xsd" "$f" 2>"$RUNNER_TEMP/err" \
              || { rc=1; sed "s|^|::error file=$f::|" "$RUNNER_TEMP/err"; }
          done
          exit $rc

  pkgcheck:
    name: pkgcheck --commits
    runs-on: ubuntu-latest
    steps:
      - *checkout-topic
      - *find-base
      - uses: pkgcore/pkgcheck-action@v1
        with:
          args: --commits upstream/master

  nvd:
    # informational only: vendor:product should exist in the NVD CPE dictionary
    name: NVD existence (warnings)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - *checkout-topic
      - *checkout-ci
      - *find-base
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: .cpe-nvd-cache.json
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - name: query NVD
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python3 _ci/.github/scripts/cpe-lint.py --base "$BASE" --nvd --github || true
